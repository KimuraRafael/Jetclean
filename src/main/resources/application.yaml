spring:
  application:
    name: JetClean

  datasource:
    url: jdbc:postgresql://localhost:5432/jetclean
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true

  flyway:
    enabled: true
    hibernate:
      ddl-auto: validate